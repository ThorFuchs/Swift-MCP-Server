name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-27:
    # GitHub-hosted runners do not provide Xcode 27 yet; this job needs a self-hosted
    # macOS 27 runner labelled `macos-27`. It is skipped until the repository variable
    # HAS_MACOS27_RUNNER is set to `true`. Fork pull requests never run on it.
    if: >-
      vars.HAS_MACOS27_RUNNER == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, macos-27]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: swift --version
      - run: Scripts/test.sh
      # The example resolves the core by URL (main), so it checks the example itself against
      # the published core, not this checkout's core sources.
      - name: Wikipedia Research Explorer tests
        run: Examples/WikipediaResearchExplorer/Scripts/test.sh
