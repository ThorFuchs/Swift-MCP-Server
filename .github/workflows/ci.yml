name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      qualify_release:
        description: Run optimized tests in addition to the normal suite
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-27:
    # GitHub-hosted runners do not provide Xcode 27 yet; this job needs a self-hosted
    # macOS 27 runner labelled `macos-27`. It is skipped until the repository variable
    # HAS_MACOS27_RUNNER is set to `true`. Fork pull requests never run on it.
    if: >-
      vars.HAS_MACOS27_RUNNER == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, macos-27]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: swift --version
      - name: Verify unified lockfile pins and manifest hashes
        run: python3 Scripts/check-core-dependency-pins.py
      - name: Test locked Core and stdio dependency graph
        env:
          MCP_STRICT_RESOLUTION: "1"
        run: Scripts/test.sh
      - name: Optimized release qualification
        if: github.event_name == 'workflow_dispatch' && inputs.qualify_release
        env:
          MCP_STRICT_RESOLUTION: "1"
          MCP_FIXTURE_CONFIGURATION: release
        run: Scripts/test.sh -c release
      - name: Build all public DocC archives
        run: bash Scripts/build-docs.sh
      - name: Inventory public symbol documentation
        run: python3 Scripts/audit-docs.py
      - name: Verify no tracked Core and stdio lockfile drift
        if: always()
        run: git diff --exit-code -- Package.resolved Examples/StdioServer/Package.resolved Tools/StdioFixture/Package.resolved
      # Research Explorer is CI-tested independently in ThorFuchs/Swift-MCP-Examples.
      # Keep Core CI scoped to the SDK and its own stdio fixtures.

  linux:
    # Opt in to the Studio Linux ARM64 runner for trusted same-repository work.
    # Keep hosted Ubuntu as the default, including fork PRs in this workflow.
    runs-on: >-
      ${{ fromJSON(vars.USE_SELF_HOSTED_LINUX == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && '["self-hosted","Linux","ARM64","swift-ci-linux"]' || '"ubuntu-24.04"') }}
    container:
      # swift:6.4.2-noble multi-architecture index, pinned by digest.
      image: swift@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Record Linux architecture and Swift version
        run: |
          uname -sm
          swift --version
      - name: Test locked Core and stdio dependency graph
        env:
          MCP_STRICT_RESOLUTION: "1"
        run: Scripts/test.sh
      - name: Optimized release qualification
        if: github.event_name == 'workflow_dispatch' && inputs.qualify_release
        env:
          MCP_STRICT_RESOLUTION: "1"
          MCP_FIXTURE_CONFIGURATION: release
        run: Scripts/test.sh -c release
      - name: Verify no tracked Core and stdio lockfile drift
        if: always()
        run: git diff --exit-code -- Package.resolved Examples/StdioServer/Package.resolved Tools/StdioFixture/Package.resolved
